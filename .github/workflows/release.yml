name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/themes/*.zip dist/integrations/*.zip)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Promotion Kit $GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            "${assets[@]}"
